---
# Same pattern as registry_auth: kubectl diff exits 0 when the live object
# matches, 1 when it differs or is missing; apply only then, so a second run
# reports no changes. Server-side apply keeps the data out of annotations.
- name: Check for the Argo CD namespace
  ansible.builtin.command:
    cmd: "{{ argocd_redis_auth_kubectl }} get namespace {{ argocd_redis_auth_namespace }}"
  register: argocd_redis_auth_ns
  changed_when: false
  failed_when: false

- name: Create the Argo CD namespace
  ansible.builtin.command:
    cmd: "{{ argocd_redis_auth_kubectl }} create namespace {{ argocd_redis_auth_namespace }}"
  when: argocd_redis_auth_ns.rc != 0
  changed_when: true

- name: Render the argocd-redis Secret
  ansible.builtin.set_fact:
    argocd_redis_auth_manifest:
      apiVersion: v1
      kind: Secret
      metadata:
        name: "{{ argocd_redis_auth_secret }}"
        namespace: "{{ argocd_redis_auth_namespace }}"
        labels:
          app.kubernetes.io/part-of: argocd
      type: Opaque
      stringData:
        auth: "{{ argocd_redis_auth_password }}"
  no_log: true

- name: Compare with the cluster
  ansible.builtin.command:
    cmd: "{{ argocd_redis_auth_kubectl }} diff --server-side -f -"
    stdin: "{{ argocd_redis_auth_manifest | to_json }}"
  register: argocd_redis_auth_diff
  changed_when: false
  failed_when: argocd_redis_auth_diff.rc > 1
  no_log: true

- name: Apply the argocd-redis Secret
  ansible.builtin.command:
    cmd: "{{ argocd_redis_auth_kubectl }} apply --server-side -f -"
    stdin: "{{ argocd_redis_auth_manifest | to_json }}"
  when: argocd_redis_auth_diff.rc == 1
  changed_when: true
  no_log: true
