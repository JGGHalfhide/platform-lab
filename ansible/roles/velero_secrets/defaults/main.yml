---
# Velero's Secrets, created from Vault before Argo CD deploys Velero:
# - velero-s3: AWS-style credentials file (key `cloud`) for the Garage
#   bucket on the build host (scripts/backup-store.sh). Mounted as a file.
# - velero-repo-credentials: the Kopia repository password, which encrypts
#   file-system backups. Velero otherwise uses a built-in default password.
velero_secrets_namespace: velero
velero_secrets_s3_key_id: "{{ vault_velero_s3_key_id }}"
velero_secrets_s3_secret: "{{ vault_velero_s3_secret }}"
velero_secrets_repo_password: "{{ vault_velero_repo_password }}"

velero_secrets_kubectl: >-
  /var/lib/rancher/rke2/bin/kubectl --kubeconfig /etc/rancher/rke2/rke2.yaml
