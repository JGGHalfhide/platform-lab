---
# aide_use_fips_hashes, aide_verify_acls, aide_verify_ext_attributes,
# aide_check_audit_tools, aide_build_database, aide_scan_notification.
# A hash can be first, in the middle or last in a group ("sha1+rmd160+...");
# remove it with its own "+" so the line stays valid (a leading "+" is a
# syntax error that makes `aide --init` fail).
- name: Remove non-FIPS hashes that are followed by another attribute
  ansible.builtin.replace:
    path: /etc/aide.conf
    regexp: '^([A-Z][A-Za-z0-9_]*\s*=\s*(?:\S*\+)?){{ item }}\+'
    replace: '\1'
  loop: &hardening_aide_weak_hashes [md5, sha1, rmd160, sha256, tiger, haval, gost, crc32, whirlpool]

- name: Remove non-FIPS hashes at the end of a group
  ansible.builtin.replace:
    path: /etc/aide.conf
    regexp: '^([A-Z][A-Za-z0-9_]*\s*=\s*\S*)\+{{ item }}(?=\s|$)'
    replace: '\1'
  loop: *hardening_aide_weak_hashes

- name: Remove stray leading "+" from AIDE rule groups
  ansible.builtin.replace:
    path: /etc/aide.conf
    regexp: '^([A-Z][A-Za-z0-9_]*\s*=\s*)\++'
    replace: '\1'

- name: Add sha512, ACLs and extended attributes to AIDE rule groups
  ansible.builtin.replace:
    path: /etc/aide.conf
    regexp: '^([A-Z][A-Za-z0-9_]*\s*=\s*(?!.*\b{{ item }}\b)\S.*?)\s*$'
    replace: '\1+{{ item }}'
  loop: [sha512, acl, xattrs]

- name: Protect the audit tools with AIDE
  ansible.builtin.lineinfile:
    path: /etc/aide.conf
    regexp: '^(/usr)?/sbin/{{ item }}\s'
    line: /usr/sbin/{{ item }} p+i+n+u+g+s+b+acl+xattrs+sha512
  loop:
    - auditctl
    - auditd
    - ausearch
    - aureport
    - autrace
    - augenrules
    - rsyslogd

# Built once; takes a few minutes.
- name: Build the AIDE database
  ansible.builtin.shell: |
    set -o pipefail
    aide --init
    mv /var/lib/aide/aide.db.new.gz /var/lib/aide/aide.db.gz
  args:
    creates: /var/lib/aide/aide.db.gz

- name: Run a daily AIDE check and mail the result to root
  ansible.builtin.copy:
    dest: /etc/cron.d/aide
    content: |
      # Managed by Ansible (hardening role).
      0 5 * * * root /usr/sbin/aide --check | /bin/mail -s "$(hostname) - AIDE Integrity Check" root@localhost
    owner: root
    group: root
    mode: "0644"
