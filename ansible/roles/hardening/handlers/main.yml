---
- name: Restart sshd
  ansible.builtin.systemd_service:
    name: sshd
    state: restarted

# auditd refuses `systemctl restart`; `service` is the supported path.
- name: Restart auditd
  ansible.builtin.command: service auditd restart  # noqa: command-instead-of-module
  changed_when: true

- name: Restart chronyd
  ansible.builtin.systemd_service:
    name: chronyd
    state: restarted

- name: Restart rsyslog
  ansible.builtin.systemd_service:
    name: rsyslog
    state: restarted

- name: Restart postfix
  ansible.builtin.systemd_service:
    name: postfix
    state: restarted

- name: Restart usbguard
  ansible.builtin.systemd_service:
    name: usbguard
    state: restarted

- name: Reload NetworkManager connections
  ansible.builtin.command: nmcli connection reload
  changed_when: true

# Never without /etc/default/grub (tasks/boot.yml): the rebuilt grub.cfg
# would lack BLS support and the boot entries' kernel arguments.
- name: Rebuild grub.cfg
  ansible.builtin.command: grub2-mkconfig -o /boot/grub2/grub.cfg
  when: hardening_default_grub.stat.exists | default(false)
  changed_when: true

- name: Reload systemd
  ansible.builtin.systemd_service:
    daemon_reload: true

- name: Rebuild aliases
  ansible.builtin.command: newaliases
  changed_when: true

- name: Remount /boot
  ansible.posix.mount:
    path: /boot
    state: remounted

- name: Remount /boot/efi
  ansible.posix.mount:
    path: /boot/efi
    state: remounted
