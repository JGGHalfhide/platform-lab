---
# Rules deliberately not remediated, keyed by scap-security-guide rule ID
# (without the xccdf_org.ssgproject.content_rule_ prefix). Tasks for a listed
# rule are skipped. docs/hardening.md mirrors this list.
hardening_exceptions:
  installed_OS_is_vendor_supported: >-
    The STIG only recognizes RHEL. Rocky Linux always fails this check.
  package_subscription-manager_installed: >-
    Red Hat subscription tooling; not applicable to Rocky Linux.
  partition_for_home: &partitions >-
    The Rocky GenericCloud image has a single root filesystem. Separate
    partitions need a custom disk layout (revisit with an LVM image).
  partition_for_tmp: *partitions
  partition_for_var: *partitions
  partition_for_var_log: *partitions
  partition_for_var_log_audit: *partitions
  partition_for_var_tmp: *partitions
  sysctl_net_ipv4_conf_all_forwarding: &forwarding >-
    Kubernetes nodes route pod and service traffic; forwarding must be on.
  sysctl_net_ipv6_conf_all_forwarding: *forwarding
  sysctl_user_max_user_namespaces_no_remediation: >-
    Container runtimes use user namespaces; scap-security-guide ships no
    remediation for this rule.
  service_fapolicyd_enabled: &fapolicyd >-
    fapolicyd's deny-by-default policy blocks RKE2 and containerd binaries
    under /var/lib/rancher. Package installed; trust rules to be designed.
  fapolicy_default_deny: *fapolicyd
  banner_etc_issue: >-
    The check requires the DoD notice-and-consent text. This is not a DoD
    system; a generic authorized-use banner is used instead.
  sssd_certificate_verification: &pki >-
    No PKI or smart card (CAC) infrastructure in the lab.
  sssd_enable_certmap: *pki
  sssd_enable_smartcards: *pki
  rsyslog_remote_loghost: &remotelog >-
    No central log server yet (logging stack is Week 7).
  rsyslog_encrypt_offload_actionsendstreamdriverauthmode: *remotelog
  rsyslog_encrypt_offload_actionsendstreamdrivermode: *remotelog
  rsyslog_encrypt_offload_defaultnetstreamdriver: *remotelog
  selinux_context_elevation_for_sudo: >-
    Needs the admin user confined to staff_u; with unconfined_u the sudo
    role transition fails and locks out automation. Revisit.
  accounts_authorized_local_users: >-
    The authorized-user list is site-specific and needs a tailoring file.
  network_configure_name_resolution: >-
    The libvirt network provides a single DNS resolver.
  fips_custom_stig_sub_policy: >-
    Contradicts harden_sshd_macs_*_crypto_policy in the same profile: this
    rule wants the sub-policy to list HMAC-SHA2-512 first, the MAC checks
    want HMAC-SHA2-256 first. Same algorithms, different order; the MAC
    order is kept so two of the three rules pass.
  postfix_client_configure_mail_alias: >-
    The check expects root's alias to be the profile's placeholder value
    (change_me@localhost). Root's mail goes to the admin user instead.
  dir_perms_world_writable_sticky_bits: &kubelet >-
    Only kubelet pod volumes and container image layers match; Kubernetes
    manages those paths.
  file_permissions_ungroupowned: *kubelet

# FIPS mode plus the STIG SSH sub-policy (STIG profile value: FIPS:STIG).
hardening_crypto_policy: FIPS:STIG

hardening_login_banner: |
  Authorized use only. Activity on this system is monitored and logged.

hardening_time_servers:
  - 0.rocky.pool.ntp.org
  - 1.rocky.pool.ntp.org

hardening_grub_superuser: grubadmin

hardening_kernel_args:
  - audit=1
  - audit_backlog_limit=8192
  - init_on_free=1
  - page_poison=1
  - pti=on
  - vsyscall=none

hardening_disabled_kernel_modules:
  - atm
  - bluetooth
  - can
  - cramfs
  - firewire-core
  - sctp
  - tipc
  - usb-storage

# rule ID -> [sysctl key, value]
hardening_sysctls:
  sysctl_kernel_core_pattern: [kernel.core_pattern, "|/bin/false"]
  sysctl_kernel_dmesg_restrict: [kernel.dmesg_restrict, "1"]
  sysctl_kernel_kexec_load_disabled: [kernel.kexec_load_disabled, "1"]
  sysctl_kernel_perf_event_paranoid: [kernel.perf_event_paranoid, "2"]
  sysctl_kernel_randomize_va_space: [kernel.randomize_va_space, "2"]
  sysctl_kernel_unprivileged_bpf_disabled: [kernel.unprivileged_bpf_disabled, "1"]
  sysctl_kernel_yama_ptrace_scope: [kernel.yama.ptrace_scope, "1"]
  sysctl_net_core_bpf_jit_harden: [net.core.bpf_jit_harden, "2"]
  sysctl_net_ipv4_conf_all_accept_redirects: [net.ipv4.conf.all.accept_redirects, "0"]
  sysctl_net_ipv4_conf_all_accept_source_route: [net.ipv4.conf.all.accept_source_route, "0"]
  sysctl_net_ipv4_conf_all_forwarding: [net.ipv4.conf.all.forwarding, "0"]
  sysctl_net_ipv4_conf_all_log_martians: [net.ipv4.conf.all.log_martians, "1"]
  sysctl_net_ipv4_conf_all_rp_filter: [net.ipv4.conf.all.rp_filter, "1"]
  sysctl_net_ipv4_conf_all_send_redirects: [net.ipv4.conf.all.send_redirects, "0"]
  sysctl_net_ipv4_conf_default_accept_redirects: [net.ipv4.conf.default.accept_redirects, "0"]
  sysctl_net_ipv4_conf_default_log_martians: [net.ipv4.conf.default.log_martians, "1"]
  sysctl_net_ipv4_conf_default_rp_filter: [net.ipv4.conf.default.rp_filter, "1"]
  sysctl_net_ipv4_conf_default_send_redirects: [net.ipv4.conf.default.send_redirects, "0"]
  sysctl_net_ipv4_icmp_echo_ignore_broadcasts: [net.ipv4.icmp_echo_ignore_broadcasts, "1"]
  sysctl_net_ipv4_icmp_ignore_bogus_error_responses: [net.ipv4.icmp_ignore_bogus_error_responses, "1"]
  sysctl_net_ipv4_tcp_syncookies: [net.ipv4.tcp_syncookies, "1"]
  sysctl_net_ipv6_conf_all_accept_ra: [net.ipv6.conf.all.accept_ra, "0"]
  sysctl_net_ipv6_conf_all_accept_redirects: [net.ipv6.conf.all.accept_redirects, "0"]
  sysctl_net_ipv6_conf_all_accept_source_route: [net.ipv6.conf.all.accept_source_route, "0"]
  sysctl_net_ipv6_conf_all_forwarding: [net.ipv6.conf.all.forwarding, "0"]
  sysctl_net_ipv6_conf_default_accept_ra: [net.ipv6.conf.default.accept_ra, "0"]
  sysctl_net_ipv6_conf_default_accept_redirects: [net.ipv6.conf.default.accept_redirects, "0"]
  sysctl_net_ipv6_conf_default_accept_source_route: [net.ipv6.conf.default.accept_source_route, "0"]

# Commands audited on execution (audit_rules_privileged_commands_* and
# audit_privileged_commands_*).
hardening_audited_commands:
  - /usr/bin/chage
  - /usr/bin/chcon
  - /usr/bin/chacl
  - /usr/bin/chsh
  - /usr/bin/crontab
  - /usr/bin/gpasswd
  - /usr/bin/kmod
  - /usr/bin/mount
  - /usr/bin/newgrp
  - /usr/bin/passwd
  - /usr/bin/setfacl
  - /usr/bin/ssh-agent
  - /usr/bin/su
  - /usr/bin/sudo
  - /usr/bin/sudoedit
  - /usr/bin/umount
  - /usr/libexec/openssh/ssh-keysign
  - /usr/sbin/init
  - /usr/sbin/pam_timestamp_check
  - /usr/sbin/postdrop
  - /usr/sbin/postqueue
  - /usr/sbin/poweroff
  - /usr/sbin/reboot
  - /usr/sbin/semanage
  - /usr/sbin/setfiles
  - /usr/sbin/setsebool
  - /usr/sbin/shutdown
  - /usr/sbin/unix_chkpwd
  - /usr/sbin/unix_update
  - /usr/sbin/userhelper
  - /usr/sbin/usermod
