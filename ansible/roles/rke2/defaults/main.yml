---
# RKE2 release from the stable channel, as packaged in rpm.rancher.io.
rke2_minor: "1.36"
rke2_version: "1.36.5~rke2r1"
# SELinux policy package (common repo). Connected nodes get it as a dependency;
# airgap staging (scripts/airgap-stage.sh) downloads this exact version, the
# one the build node runs.
rke2_selinux_version: "0.24-1.el9"

rke2_repo_base: https://rpm.rancher.io/rke2/latest
rke2_gpg_key_url: https://rpm.rancher.io/public.key
# Rancher (CI) <ci@rancher.com> signing key.
rke2_gpg_key_fingerprint: C8CF F216 4551 26E9 B9C9 18BE 925E A29A E257 814A

# Must match the trusted firewalld sources in the base role.
rke2_cluster_cidr: 10.42.0.0/16
rke2_service_cidr: 10.43.0.0/16

# Written to /etc/rancher/rke2/config.yaml.
rke2_config:
  profile: cis
  selinux: true
  write-kubeconfig-mode: "0600"
  cluster-cidr: "{{ rke2_cluster_cidr }}"
  service-cidr: "{{ rke2_service_cidr }}"
  tls-san:
    - "{{ ansible_host | default(inventory_hostname) }}"
  # etcd snapshots (docs/recovery.md): every 6 hours, 12 kept (3 days),
  # zstd-compressed, in /var/lib/rancher/rke2/server/db/snapshots.
  # `make etcd-snapshot SNAPSHOT=...` takes one on demand and copies it to the
  # build host, so a restore does not depend on the node's disk.
  etcd-snapshot-schedule-cron: "0 */6 * * *"
  etcd-snapshot-retention: 12
  etcd-snapshot-compress: true
  # etcd metrics on :2381 (plain HTTP, metrics only) for Prometheus and the
  # etcd dashboard (docs/observability.md). firewalld does not open 2381 in
  # the public zone: only the node and pods (trusted zone) reach it.
  etcd-expose-metrics: true

# Admin kubeconfig copied to the controller (repo root; gitignored).
rke2_kubeconfig_dest: "{{ playbook_dir }}/../kubeconfig"

# Airgap mode (airgap_servers): install from artifacts staged on the
# controller by scripts/airgap-stage.sh instead of rpm.rancher.io; preload
# the RKE2 and local-path-provisioner images; deploy local-path-provisioner
# through RKE2's manifests directory (Zarf's registry needs a default
# StorageClass before `zarf init`).
rke2_airgap: false
rke2_airgap_artifacts_dir: ""
# Where the RPMs are kept on the node (root only).
rke2_airgap_rpm_dir: /var/lib/rancher/rke2-artifacts/rpms
