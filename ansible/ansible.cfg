[defaults]
inventory = inventory.ini
roles_path = roles
interpreter_python = auto_silent
# Vault key lives outside the repo; back it up (see README).
vault_password_file = ~/.config/platform-lab/vault-pass

[ssh_connection]
# Project-local known_hosts: rebuilt VMs reuse DHCP addresses with new host
# keys. `make down` deletes this file.
# FIPS-approved host key types only: FIPS mode drops the ed25519 host key, so
# learning it before the FIPS reboot would look like a changed host after it.
ssh_args = -o ControlMaster=auto -o ControlPersist=60s -o StrictHostKeyChecking=accept-new -o UserKnownHostsFile=.known_hosts -o HostKeyAlgorithms=ecdsa-sha2-nistp384,ecdsa-sha2-nistp256,ecdsa-sha2-nistp521,rsa-sha2-512,rsa-sha2-256
pipelining = true
