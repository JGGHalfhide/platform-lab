[defaults]
inventory = inventory.ini
roles_path = roles
interpreter_python = auto_silent

[ssh_connection]
# Project-local known_hosts: rebuilt VMs reuse DHCP addresses with new host
# keys. `make down` deletes this file.
ssh_args = -o ControlMaster=auto -o ControlPersist=60s -o StrictHostKeyChecking=accept-new -o UserKnownHostsFile=.known_hosts
pipelining = true
