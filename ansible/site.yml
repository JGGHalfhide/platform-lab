---
# The node keeps a fixed MAC and address across rebuilds, so libvirt can still
# hold the previous VM's DHCP lease and Terraform's wait_for_ip returns before
# the new VM has booted. Wait for SSH itself.
- name: Wait for the node to accept SSH
  hosts: rke2_servers
  gather_facts: false
  tasks:
    - name: Wait for connection
      ansible.builtin.wait_for_connection:
        delay: 5
        timeout: 600

# Both clusters: the build node (connected) and the airgapped node (iMac or
# its rehearsal VM). On airgap_servers the rke2 role installs from the
# artifacts staged by `make airgap-stage` (group_vars/airgap_servers).
- name: Base OS configuration, STIG hardening and RKE2
  hosts: rke2_servers
  become: true
  roles:
    - base
    - hardening
    - openscap
    - rke2
    - sample_app_secret

# Build cluster only: Secrets for the in-cluster registry and Argo CD, which
# the airgapped cluster does not run (Zarf brings its own registry), and for
# Velero (backups to Garage on the build host).
- name: Build cluster Secrets
  hosts: build_servers
  become: true
  roles:
    - registry_auth
    - argocd_redis_auth
    - velero_secrets
