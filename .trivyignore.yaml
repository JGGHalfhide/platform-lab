# Trivy exceptions for `make image` (scripts/publish-image.sh). Each entry is
# scoped to the file it applies to and says why it is not exploitable here.
# Suppressed findings still appear in each image's trivy.txt / trivy.json
# (--show-suppressed); they only stop counting toward the gate.
# Review when the image is updated; remove entries the new image fixes.
vulnerabilities:
  - id: CVE-2025-68121
    paths: ["usr/local/bin/gosu"]
    statement: >-
      CRITICAL, Go stdlib v1.24.6 in gosu (postgres image, sample app). gosu only
      runs when the container starts as root; the pod runs as UID 70 and root
      is rejected by the restricted Pod Security level and Kyverno. Added 11/16.
