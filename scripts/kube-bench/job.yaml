# One-shot kube-bench run against the RKE2 CIS benchmark.
# Applied and removed by scripts/kube-bench.sh (make bench); not part of GitOps.
apiVersion: v1
kind: Namespace
metadata:
  name: kube-bench
  labels:
    # The scanner needs hostPID and host paths; the RKE2 CIS default is restricted.
    pod-security.kubernetes.io/enforce: privileged
    pod-security.kubernetes.io/warn: privileged
    pod-security.kubernetes.io/audit: privileged
---
# The scanner must not trip the checks it runs: no automounted tokens (5.1.5,
# 5.1.6) and no wildcard RBAC (5.1.3).
apiVersion: v1
kind: ServiceAccount
metadata:
  name: default
  namespace: kube-bench
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: kube-bench
  namespace: kube-bench
automountServiceAccountToken: false
---
# Read-only access for the section 5 (policies) checks.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: kube-bench-read
rules:
  - apiGroups: ["rbac.authorization.k8s.io"]
    resources: ["clusterroles", "clusterrolebindings", "roles", "rolebindings"]
    verbs: ["get", "list"]
  - apiGroups: [""]
    resources: ["pods", "serviceaccounts", "namespaces"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: kube-bench-read
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: kube-bench-read
subjects:
  - kind: ServiceAccount
    name: kube-bench
    namespace: kube-bench
---
apiVersion: batch/v1
kind: Job
metadata:
  name: kube-bench
  namespace: kube-bench
spec:
  backoffLimit: 0
  template:
    spec:
      serviceAccountName: kube-bench
      # The token is mounted explicitly below instead of automounted.
      automountServiceAccountToken: false
      hostPID: true
      restartPolicy: Never
      tolerations:
        - operator: Exists
      containers:
        - name: kube-bench
          # aquasec/kube-bench:v0.16.0
          image: docker.io/aquasec/kube-bench@sha256:75506f222d1eb6ce2a751a5533bdc0a3b54c898e2e49e7751d0ee22cfb862679
          command: ["kube-bench", "run", "--benchmark", "rke2-cis-1.9"]
          securityContext:
            # Needed to read host files with SELinux enforcing (runs as spc_t).
            privileged: true
          volumeMounts:
            - { name: var-lib-rancher, mountPath: /var/lib/rancher, readOnly: true }
            - { name: etc-rancher, mountPath: /etc/rancher, readOnly: true }
            # Host user/group names so ownership checks (etcd:etcd) resolve.
            - { name: etc-passwd, mountPath: /etc/passwd, readOnly: true }
            - { name: etc-group, mountPath: /etc/group, readOnly: true }
            - name: api-access
              mountPath: /var/run/secrets/kubernetes.io/serviceaccount
              readOnly: true
      volumes:
        - { name: var-lib-rancher, hostPath: { path: /var/lib/rancher } }
        - { name: etc-rancher, hostPath: { path: /etc/rancher } }
        - { name: etc-passwd, hostPath: { path: /etc/passwd, type: File } }
        - { name: etc-group, hostPath: { path: /etc/group, type: File } }
        - name: api-access
          projected:
            sources:
              - serviceAccountToken: { path: token, expirationSeconds: 3600 }
              - configMap: { name: kube-root-ca.crt, items: [{ key: ca.crt, path: ca.crt }] }
              - downwardAPI:
                  items:
                    - { path: namespace, fieldRef: { fieldPath: metadata.namespace } }
