# Argo CD, pinned upstream manifests. Applied once by `make argocd`, then
# Argo CD manages itself from this path (gitops/apps/argocd.yaml).
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: argocd
resources:
  - namespace.yaml
  - default-sa.yaml
  - https://raw.githubusercontent.com/argoproj/argo-cd/v3.6.1/manifests/install.yaml
patches:
  # CIS 5.1.6: no ServiceAccount automounts a token. Workloads that call the
  # API get an explicitly projected token instead (patches/token-*.yaml);
  # argocd-repo-server needs none, and argocd-redis needs one only in its
  # secret-init init container.
  - target:
      kind: ServiceAccount
    patch: |-
      apiVersion: v1
      kind: ServiceAccount
      metadata:
        name: any
      automountServiceAccountToken: false
  - path: patches/token-argocd-application-controller.yaml
  - path: patches/token-argocd-applicationset-controller.yaml
  - path: patches/token-argocd-dex-server.yaml
  - path: patches/token-argocd-notifications-controller.yaml
  - path: patches/token-argocd-redis.yaml
  - path: patches/token-argocd-server.yaml
  # RKE2's Traefik listens on host ports behind a ClusterIP Service, so it
  # never publishes a load-balancer address in Ingress status. Argo CD's
  # default Ingress check waits for one and stays Progressing; treat an
  # Ingress as Healthy once it exists.
  - target:
      kind: ConfigMap
      name: argocd-cm
    patch: |-
      apiVersion: v1
      kind: ConfigMap
      metadata:
        name: argocd-cm
      data:
        resource.customizations.health.networking.k8s.io_Ingress: |
          hs = {}
          hs.status = "Healthy"
          hs.message = "RKE2 Traefik uses host ports; no load-balancer address is published"
          return hs
