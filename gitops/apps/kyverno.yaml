# Kyverno policy engine (admission, background, cleanup, reports controllers).
# v1.19.2 (chart 3.9.2): latest patch of the previous minor; 1.20.0 was days
# old when installed.
# - Runs under the cluster-wide restricted Pod Security level, no exemption.
# - CIS 5.1.5/5.1.6: no automounted tokens anywhere; the chart mounts
#   projected, time-limited tokens for the controllers that call the API.
# - CRD storage migration (post-upgrade hook) is off. It only matters for
#   in-place upgrades; this cluster upgrades by rebuild or Zarf redeploy. The
#   hook also failed kube-bench 5.1.6: the chart keeps the finished Job's pod
#   but deletes its ServiceAccount, and the check counts a pod whose
#   ServiceAccount is missing as non-compliant. Its ClusterRole uses
#   wildcards (5.1.3). Re-enable for one sync if upgrading in place.
# - Policies live in gitops/policies/ (their own Application).
# - Chart values: gitops/values/kyverno.yaml (shared with zarf/platform).
# - PolicyExceptions are enabled, but only in the kyverno namespace, which
#   only Argo CD (from gitops/policies/) writes to.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: kyverno
  namespace: argocd
spec:
  project: default
  sources:
    - repoURL: https://kyverno.github.io/kyverno
      chart: kyverno
      targetRevision: 3.9.2
      helm:
        valueFiles:
          - $repo/gitops/values/kyverno.yaml
    # Also the source of the chart values ($repo).
    - repoURL: https://github.com/JGGHalfhide/platform-lab.git
      targetRevision: main
      path: gitops/kyverno
      ref: repo
  destination:
    server: https://kubernetes.default.svc
    namespace: kyverno
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      # Kyverno's CRDs exceed the client-side apply annotation size limit.
      - ServerSideApply=true
