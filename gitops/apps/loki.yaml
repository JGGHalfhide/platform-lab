# loki (chart 7.5.0), monitoring namespace; values in
# gitops/values/loki.yaml (shared with the airgapped cluster's Zarf
# package). See docs/observability.md.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: loki
  namespace: argocd
spec:
  project: default
  sources:
    - repoURL: https://grafana.github.io/helm-charts
      chart: loki
      targetRevision: 7.5.0
      helm:
        releaseName: loki
        valueFiles:
          - $repo/gitops/values/loki.yaml
    # Source of the chart values ($repo) only.
    - repoURL: https://github.com/JGGHalfhide/platform-lab.git
      targetRevision: main
      ref: repo
  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      # Large CRDs (kube-prometheus-stack) exceed the client-side apply limit.
      - ServerSideApply=true
      # ServiceMonitors before the Prometheus Operator CRDs exist.
      - SkipDryRunOnMissingResource=true
    retry:
      limit: 10
      backoff:
        duration: 15s
        factor: 2
        maxDuration: 5m
