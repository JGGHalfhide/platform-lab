# Grafana Alloy values (chart 1.15.0, Alloy v1.21.3), build cluster
# (gitops/apps/alloy.yaml); shared with the airgapped cluster's Zarf package.
#
# Collects pod logs and Kubernetes events through the API
# (loki.source.kubernetes / loki.source.kubernetes_events) and sends them to
# Loki. No hostPath to /var/log, no root, no SELinux exception: one restricted
# Deployment with a projected token (CIS 5.1.5/5.1.6). On a single node the
# extra API traffic is small.
controller:
  type: deployment
  replicas: 1
  volumes:
    extra:
      - name: kube-api-access
        projected:
          defaultMode: 0444
          sources:
            - serviceAccountToken:
                path: token
                expirationSeconds: 3607
            - configMap:
                name: kube-root-ca.crt
                items:
                  - key: ca.crt
                    path: ca.crt
            - downwardAPI:
                items:
                  - path: namespace
                    fieldRef:
                      fieldPath: metadata.namespace
      - name: tmp
        emptyDir: {}

serviceAccount:
  automountServiceAccountToken: false

global:
  podSecurityContext:
    runAsNonRoot: true
    runAsUser: 473
    runAsGroup: 473
    fsGroup: 473
    seccompProfile:
      type: RuntimeDefault

alloy:
  # Positions and WAL under /tmp (emptyDir); the root filesystem is read-only.
  storagePath: /tmp/alloy
  mounts:
    varlog: false
    dockercontainers: false
    extra:
      - name: kube-api-access
        mountPath: /var/run/secrets/kubernetes.io/serviceaccount
        readOnly: true
      - name: tmp
        mountPath: /tmp
  securityContext:
    allowPrivilegeEscalation: false
    readOnlyRootFilesystem: true
    capabilities:
      drop: ["ALL"]
  resources:
    requests:
      cpu: 20m
      memory: 96Mi
    limits:
      memory: 256Mi
  configMap:
    content: |-
      // Pods on this cluster, labelled for Loki queries.
      discovery.kubernetes "pods" {
        role = "pod"
      }

      discovery.relabel "pods" {
        targets = discovery.kubernetes.pods.targets

        rule {
          source_labels = ["__meta_kubernetes_namespace"]
          target_label  = "namespace"
        }
        rule {
          source_labels = ["__meta_kubernetes_pod_name"]
          target_label  = "pod"
        }
        rule {
          source_labels = ["__meta_kubernetes_pod_container_name"]
          target_label  = "container"
        }
        rule {
          source_labels = ["__meta_kubernetes_pod_label_app_kubernetes_io_name"]
          target_label  = "app"
        }
      }

      // Container logs read through the Kubernetes API.
      loki.source.kubernetes "pods" {
        targets    = discovery.relabel.pods.output
        forward_to = [loki.write.default.receiver]
      }

      // Kubernetes events (scheduling, image pulls, policy rejections
      // reported by controllers).
      loki.source.kubernetes_events "events" {
        job_name   = "kubernetes-events"
        forward_to = [loki.write.default.receiver]
      }

      loki.write "default" {
        endpoint {
          url = "http://loki.monitoring.svc:3100/loki/api/v1/push"
        }
      }

configReloader:
  resources:
    requests:
      cpu: 10m
      memory: 32Mi
    limits:
      memory: 64Mi
