# kube-prometheus-stack values (chart 92.17.0, Prometheus Operator v0.94.2),
# build cluster (gitops/apps/kube-prometheus-stack.yaml); shared with the
# airgapped cluster's Zarf package.
#
# - Restricted Pod Security in `monitoring`; node-exporter alone in
#   `monitoring-node` (host network, PID and /proc, /sys, / read-only).
# - CIS 5.1.5/5.1.6: no automounted tokens. Components that call the API
#   (operator, Prometheus, kube-state-metrics, Grafana's dashboard sidecar)
#   get an explicitly projected, time-limited one.
# - STIG V-242415: no Secrets in environment variables. Grafana reads the
#   admin credentials from files ($__file{}, grafana-admin Secret from the
#   grafana_admin role); the sidecars' reload calls (which need them in env)
#   are off.
# - Alertmanager, admission webhooks (their cert Jobs) and test pods are off.

alertmanager:
  enabled: false

# RKE2 binds the controller manager, scheduler and kube-proxy metrics to
# 127.0.0.1 (CIS 1.3.7, 1.4.2); they are not scraped.
kubeControllerManager:
  enabled: false
kubeScheduler:
  enabled: false
kubeProxy:
  enabled: false
# etcd metrics: RKE2 `etcd-expose-metrics: true` (rke2 role) serves them on
# the node's :2381 over plain HTTP; reachable from pods only (firewalld).
kubeEtcd:
  enabled: true
  service:
    enabled: true
    port: 2381
    targetPort: 2381
    selector:
      component: etcd
  serviceMonitor:
    scheme: http

defaultRules:
  rules:
    alertmanager: false
    kubeControllerManager: false
    kubeSchedulerAlerting: false
    kubeSchedulerRecording: false
    kubeProxy: false

prometheusOperator:
  # The webhooks need certificates from two kubectl Jobs (another upstream
  # image, and finished hook pods trip kube-bench 5.1.6); the operator's own
  # TLS uses the same Secret.
  admissionWebhooks:
    enabled: false
  tls:
    enabled: false
  serviceAccount:
    automountServiceAccountToken: false
  automountServiceAccountToken: false
  extraVolumes: &token-volume
    - name: kube-api-access
      projected:
        defaultMode: 0444
        sources:
          - serviceAccountToken:
              path: token
              expirationSeconds: 3607
          - configMap:
              name: kube-root-ca.crt
              items:
                - key: ca.crt
                  path: ca.crt
          - downwardAPI:
              items:
                - path: namespace
                  fieldRef:
                    fieldPath: metadata.namespace
  extraVolumeMounts: &token-mount
    - name: kube-api-access
      mountPath: /var/run/secrets/kubernetes.io/serviceaccount
      readOnly: true
  resources:
    requests:
      cpu: 20m
      memory: 64Mi
    limits:
      memory: 256Mi
  prometheusConfigReloader:
    resources:
      requests:
        cpu: 10m
        memory: 32Mi
      limits:
        memory: 64Mi

prometheus:
  serviceAccount:
    automountServiceAccountToken: false
  prometheusSpec:
    automountServiceAccountToken: false
    volumes: *token-volume
    volumeMounts: *token-mount
    # Every ServiceMonitor/PodMonitor/rule in the cluster, not only this
    # release's (Kyverno, Velero).
    serviceMonitorSelectorNilUsesHelmValues: false
    podMonitorSelectorNilUsesHelmValues: false
    ruleSelectorNilUsesHelmValues: false
    retention: 3d
    retentionSize: 6GB
    resources:
      requests:
        cpu: 100m
        memory: 512Mi
      limits:
        memory: 1536Mi
    storageSpec:
      volumeClaimTemplate:
        spec:
          storageClassName: local-path
          accessModes: ["ReadWriteOnce"]
          resources:
            requests:
              storage: 8Gi

kube-state-metrics:
  automountServiceAccountToken: false
  serviceAccount:
    automountServiceAccountToken: false
  volumes: *token-volume
  volumeMounts: *token-mount
  resources:
    requests:
      cpu: 10m
      memory: 64Mi
    limits:
      memory: 256Mi
  # Kyverno's policy reports as metrics, for the policy-reports dashboard:
  # kyverno_policyreport_summary{namespace, name, result} (pass, fail, warn,
  # error, skip) and kyverno_clusterpolicyreport_summary{name, result}.
  rbac:
    extraRules:
      - apiGroups: ["wgpolicyk8s.io"]
        resources: ["policyreports", "clusterpolicyreports"]
        verbs: ["list", "watch"]
  customResourceState:
    enabled: true
    config:
      kind: CustomResourceStateMetrics
      spec:
        resources:
          - groupVersionKind:
              group: wgpolicyk8s.io
              version: v1alpha2
              kind: PolicyReport
            metricNamePrefix: kyverno_policyreport
            labelsFromPath:
              namespace: [metadata, namespace]
              name: [metadata, name]
            metrics:
              - name: summary
                help: Results in a namespaced Kyverno policy report, by result.
                each:
                  type: Gauge
                  gauge:
                    path: [summary]
                    labelFromKey: result
          - groupVersionKind:
              group: wgpolicyk8s.io
              version: v1alpha2
              kind: ClusterPolicyReport
            metricNamePrefix: kyverno_clusterpolicyreport
            labelsFromPath:
              name: [metadata, name]
            metrics:
              - name: summary
                help: Results in a cluster-scoped Kyverno policy report, by result.
                each:
                  type: Gauge
                  gauge:
                    path: [summary]
                    labelFromKey: result

prometheus-node-exporter:
  namespaceOverride: monitoring-node
  resources:
    requests:
      cpu: 10m
      memory: 32Mi
    limits:
      memory: 64Mi
  securityContext:
    runAsNonRoot: true
    runAsUser: 65534
    runAsGroup: 65534
    fsGroup: 65534
    seccompProfile:
      type: RuntimeDefault
  containerSecurityContext:
    allowPrivilegeEscalation: false
    readOnlyRootFilesystem: true
    capabilities:
      drop: ["ALL"]
    # The filesystem collector reads the host's /proc/1/mountinfo, which
    # SELinux denies to container_t (init_t's /proc entries); spc_t can read
    # it. Not privileged; same pattern as local-path's helper pods.
    seLinuxOptions:
      type: spc_t

grafana:
  testFramework:
    enabled: false
  securityContext:
    runAsNonRoot: true
    runAsUser: 472
    runAsGroup: 472
    fsGroup: 472
    seccompProfile:
      type: RuntimeDefault
  # The repo's dashboards only (gitops/monitoring/dashboards).
  defaultDashboardsEnabled: false
  automountServiceAccountToken: false
  serviceAccount:
    automountServiceAccountToken: false
  # Admin credentials as files from the grafana-admin Secret (Vault). The
  # distroless image has no /run.sh for the __FILE variables, so the values
  # use Grafana's own $__file{} expansion: the environment holds a path, not
  # the secret.
  admin:
    existingSecret: grafana-admin
  env:
    GF_SECURITY_ADMIN_USER: $__file{/etc/secrets/grafana-admin/admin-user}
    GF_SECURITY_ADMIN_PASSWORD: $__file{/etc/secrets/grafana-admin/admin-password}
  extraSecretMounts:
    - name: grafana-admin
      secretName: grafana-admin
      mountPath: /etc/secrets/grafana-admin
      readOnly: true
      defaultMode: 0440
  # Datasources provisioned by Grafana itself; the datasource sidecar would
  # put the admin login in its environment.
  datasources:
    datasources.yaml:
      apiVersion: 1
      datasources:
        - name: Prometheus
          uid: prometheus
          type: prometheus
          url: http://kps-kube-prometheus-stack-prometheus.monitoring.svc:9090
          access: proxy
          isDefault: true
        - name: Loki
          uid: loki
          type: loki
          url: http://loki.monitoring.svc:3100
          access: proxy
  # Only the dashboard sidecar; it watches ConfigMaps labelled
  # grafana_dashboard (API access, projected token) and Grafana re-reads the
  # files itself, so no reload call with the admin login.
  sidecar:
    resources:
      requests:
        cpu: 10m
        memory: 64Mi
      limits:
        memory: 128Mi
    datasources:
      enabled: false
    dashboards:
      enabled: true
      skipReload: true
      label: grafana_dashboard
      searchNamespace: monitoring
      folderAnnotation: grafana_folder
      provider:
        foldersFromFilesStructure: true
      extraMounts: *token-mount
  extraContainerVolumes: *token-volume
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      memory: 384Mi
  # The chart's /var/lib/grafana emptyDir; dashboards come from Git.
  persistence:
    enabled: false
