# Pod Security Standards (baseline): HostPath Volumes.
apiVersion: policies.kyverno.io/v1
kind: ValidatingPolicy
metadata:
  name: disallow-host-path
  annotations:
    policies.kyverno.io/title: Disallow hostPath volumes
    policies.kyverno.io/category: Pod Security Standards (baseline)
    policies.kyverno.io/description: >-
      Pods must not mount directories from the node's filesystem.
spec:
  validationActions: [Deny]
  # Workload controllers that get a generated copy of this policy.
  # ReplicaSets are left out: their Deployment and their Pods are already
  # checked, and old scaled-to-zero ReplicaSets would only add noise.
  autogen:
    podControllers:
      controllers: [deployments, statefulsets, daemonsets, jobs, cronjobs]
  evaluation:
    background:
      enabled: true
  matchConstraints:
    resourceRules:
      - apiGroups: [""]
        apiVersions: [v1]
        operations: [CREATE, UPDATE]
        resources: [pods]
    # RKE2's own components (managed by RKE2, outside admission: Kyverno's
    # webhooks already skip kube-system). Keeps background reports to what
    # this repo deploys.
    namespaceSelector:
      matchExpressions:
        - key: kubernetes.io/metadata.name
          operator: NotIn
          values: [kube-system]
  validations:
    - expression: >-
        object.spec.?volumes.orValue([]).all(v, !has(v.hostPath))
      messageExpression: >-
        'hostPath volumes are not allowed: ' +
        object.spec.?volumes.orValue([]).filter(v, has(v.hostPath)).map(v, v.name).join(', ')
