# Pod Security Standards (baseline): Privileged Containers.
apiVersion: policies.kyverno.io/v1
kind: ValidatingPolicy
metadata:
  name: disallow-privileged-containers
  annotations:
    policies.kyverno.io/title: Disallow privileged containers
    policies.kyverno.io/category: Pod Security Standards (baseline)
    policies.kyverno.io/description: >-
      Containers must not run privileged; a privileged container has
      unrestricted access to the host.
spec:
  validationActions: [Deny]
  # Workload controllers that get a generated copy of this policy.
  # ReplicaSets are left out: their Deployment and their Pods are already
  # checked, and old scaled-to-zero ReplicaSets would only add noise.
  autogen:
    podControllers:
      controllers: [deployments, statefulsets, daemonsets, jobs, cronjobs]
  evaluation:
    background:
      enabled: true
  matchConstraints:
    resourceRules:
      - apiGroups: [""]
        apiVersions: [v1]
        operations: [CREATE, UPDATE]
        resources: [pods]
    # RKE2's own components (managed by RKE2, outside admission: Kyverno's
    # webhooks already skip kube-system). Keeps background reports to what
    # this repo deploys.
    namespaceSelector:
      matchExpressions:
        - key: kubernetes.io/metadata.name
          operator: NotIn
          values: [kube-system]
  variables:
    - name: containers
      expression: >-
        object.spec.containers
        + object.spec.?initContainers.orValue([])
        + object.spec.?ephemeralContainers.orValue([])
  validations:
    - expression: >-
        variables.containers.all(c, c.?securityContext.?privileged.orValue(false) == false)
      messageExpression: >-
        'privileged containers are not allowed: ' +
        variables.containers.filter(c, c.?securityContext.?privileged.orValue(false)).map(c, c.name).join(', ')
