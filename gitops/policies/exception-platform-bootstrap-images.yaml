# The platform's own components run their upstream images. They start
# before the in-cluster registry exists (or are the registry), so they
# cannot pull from it. On the airgapped cluster Zarf rewrites every image to
# its registry, except local-path-storage: it starts with RKE2 from
# preloaded images before `zarf init` (the Zarf registry needs its
# StorageClass) and its namespace is excluded from the Zarf agent, so only
# its two entries match there.
#
# Fine-grained: restrict-image-registries still evaluates these pods; only
# the exact repositories below are added to its trusted list (each prefix
# ends at the tag separator, so a look-alike repository does not match).
apiVersion: policies.kyverno.io/v1
kind: PolicyException
metadata:
  name: platform-bootstrap-images
  namespace: kyverno
spec:
  policyRefs:
    - name: restrict-image-registries
      kind: ValidatingPolicy
  matchConditions:
    - name: platform-namespaces
      expression: >-
        object.metadata.namespace in ['argocd', 'zot', 'kyverno', 'local-path-storage', 'velero',
          'monitoring', 'monitoring-node']
  allowedValues:
    # argocd
    - "quay.io/argoproj/argocd:"
    - "ghcr.io/dexidp/dex:"
    - "public.ecr.aws/docker/library/redis:"
    # zot
    - "ghcr.io/project-zot/zot:"
    # kyverno
    - "reg.kyverno.io/kyverno/kyverno:"
    - "reg.kyverno.io/kyverno/kyvernopre:"
    - "reg.kyverno.io/kyverno/background-controller:"
    - "reg.kyverno.io/kyverno/cleanup-controller:"
    - "reg.kyverno.io/kyverno/reports-controller:"
    # velero (server, AWS plugin init container, node agent). The restore
    # helper that Velero injects into restored pods uses the signed copy in
    # the platform registry instead (gitops/velero/restore-helper-config.yaml).
    - "docker.io/velero/velero:"
    - "docker.io/velero/velero-plugin-for-aws:"
    # monitoring, monitoring-node (kube-prometheus-stack, Loki, Alloy)
    - "quay.io/prometheus/prometheus:"
    - "quay.io/prometheus-operator/prometheus-operator:"
    - "quay.io/prometheus-operator/prometheus-config-reloader:"
    - "quay.io/prometheus/node-exporter:"
    - "registry.k8s.io/kube-state-metrics/kube-state-metrics:"
    - "docker.io/grafana/grafana:"
    - "quay.io/kiwigrid/k8s-sidecar:"
    - "docker.io/grafana/loki:"
    - "docker.io/grafana/alloy:"
    # local-path-storage (provisioner and its helper pods)
    - "docker.io/rancher/local-path-provisioner:"
    - "docker.io/library/busybox:"
