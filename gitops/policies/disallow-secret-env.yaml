# DISA Kubernetes STIG V-242415 (CNTR-K8-001160): Secrets must not be stored
# as environment variables. Env vars are readable through the Pod API and by
# anything that sees the pod definition; mount Secrets as files instead.
apiVersion: policies.kyverno.io/v1
kind: ValidatingPolicy
metadata:
  name: disallow-secret-env
  annotations:
    policies.kyverno.io/title: Disallow Secrets in environment variables
    policies.kyverno.io/category: DISA Kubernetes STIG
    policies.kyverno.io/description: >-
      Containers must not take Secret values through env (secretKeyRef) or
      envFrom (secretRef); mount the Secret as a volume.
spec:
  validationActions: [Deny]
  # Workload controllers that get a generated copy of this policy.
  # ReplicaSets are left out: their Deployment and their Pods are already
  # checked, and old scaled-to-zero ReplicaSets would only add noise.
  autogen:
    podControllers:
      controllers: [deployments, statefulsets, daemonsets, jobs, cronjobs]
  evaluation:
    background:
      enabled: true
  matchConstraints:
    resourceRules:
      - apiGroups: [""]
        apiVersions: [v1]
        operations: [CREATE, UPDATE]
        resources: [pods]
    # RKE2's own components (managed by RKE2, outside admission: Kyverno's
    # webhooks already skip kube-system). Keeps background reports to what
    # this repo deploys.
    namespaceSelector:
      matchExpressions:
        - key: kubernetes.io/metadata.name
          operator: NotIn
          values: [kube-system]
  variables:
    - name: offenders
      expression: >-
        (object.spec.containers
        + object.spec.?initContainers.orValue([])
        + object.spec.?ephemeralContainers.orValue([]))
        .filter(c,
          c.?env.orValue([]).exists(e, has(e.valueFrom) && has(e.valueFrom.secretKeyRef)) ||
          c.?envFrom.orValue([]).exists(e, has(e.secretRef)))
        .map(c, c.name)
  validations:
    - expression: size(variables.offenders) == 0
      messageExpression: >-
        'Secrets must be mounted as files, not passed as environment variables (STIG V-242415): ' +
        variables.offenders.join(', ')
