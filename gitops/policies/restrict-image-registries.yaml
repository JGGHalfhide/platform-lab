# Images come only from the platform's registries, where `make image` (and
# Zarf, on the airgapped cluster) has scanned and signed them. A
# PolicyException can add exact repository prefixes through allowedValues
# (exception-platform-bootstrap-images.yaml); the policy still runs for those
# pods, so any other image is still rejected.
apiVersion: policies.kyverno.io/v1
kind: ValidatingPolicy
metadata:
  name: restrict-image-registries
  annotations:
    policies.kyverno.io/title: Trusted registries only
    policies.kyverno.io/category: Supply chain
    policies.kyverno.io/description: >-
      Container images must come from the in-cluster registry
      (127.0.0.1:30500) or the Zarf registry on the airgapped cluster
      (127.0.0.1:31999).
spec:
  validationActions: [Deny]
  # Workload controllers that get a generated copy of this policy.
  # ReplicaSets are left out: their Deployment and their Pods are already
  # checked, and old scaled-to-zero ReplicaSets would only add noise.
  autogen:
    podControllers:
      controllers: [deployments, statefulsets, daemonsets, jobs, cronjobs]
  evaluation:
    background:
      enabled: true
  matchConstraints:
    resourceRules:
      - apiGroups: [""]
        apiVersions: [v1]
        operations: [CREATE, UPDATE]
        resources: [pods]
    # RKE2's own components (managed by RKE2, outside admission: Kyverno's
    # webhooks already skip kube-system). Keeps background reports to what
    # this repo deploys.
    namespaceSelector:
      matchExpressions:
        - key: kubernetes.io/metadata.name
          operator: NotIn
          values: [kube-system]
  variables:
    - name: trusted
      expression: "['127.0.0.1:30500/', '127.0.0.1:31999/']"
    - name: untrusted
      expression: >-
        (object.spec.containers
        + object.spec.?initContainers.orValue([])
        + object.spec.?ephemeralContainers.orValue([]))
        .map(c, c.image)
        .filter(i, !(variables.trusted + exceptions.allowedValues).exists(p, i.startsWith(p)))
  validations:
    - expression: size(variables.untrusted) == 0
      messageExpression: >-
        'images must come from a trusted registry (' + variables.trusted.join(', ') +
        '): ' + variables.untrusted.join(', ')
