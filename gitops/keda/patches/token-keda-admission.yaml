# Projected API token (CIS 5.1.6: the ServiceAccount does not automount one),
# and the app.kubernetes.io/name label (require-labels) on the pods.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: keda-admission
  namespace: keda
spec:
  template:
    metadata:
      labels:
        app.kubernetes.io/name: keda-admission-webhooks
    spec:
      containers:
        - name: keda-admission-webhooks
          volumeMounts:
            - name: kube-api-access
              mountPath: /var/run/secrets/kubernetes.io/serviceaccount
              readOnly: true
      volumes:
        - name: kube-api-access
          projected:
            defaultMode: 0444
            sources:
              - serviceAccountToken:
                  path: token
                  expirationSeconds: 3607
              - configMap:
                  name: kube-root-ca.crt
                  items:
                    - key: ca.crt
                      path: ca.crt
              - downwardAPI:
                  items:
                    - path: namespace
                      fieldRef:
                        fieldPath: metadata.namespace
